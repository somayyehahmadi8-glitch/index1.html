services:
  web:
    image: node:22-slim
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
      - next_build:/app/.next
    ports:
      - "3000:3000"
    environment:
      - BASE44_PREVIEW_MODE=${BASE44_PREVIEW_MODE:-}
      - BASE44_PUBLIC_HOST_SUFFIX=${BASE44_PUBLIC_HOST_SUFFIX:-}
      - BASE44_SANDBOX_HOST_DOMAIN=${BASE44_SANDBOX_HOST_DOMAIN:-}
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
    command: ["sh", "-ec", "npm install --no-audit --no-fund && exec npm run dev"]
    restart: on-failure
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 40s

volumes:
  node_modules:
  next_build:
