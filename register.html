<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ساخت حساب کاربری — APNA STORE</title>
<meta name="description" content="ساخت حساب کاربری خود در APNA STORE.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230757C8'/><text x='16' y='23' font-size='17' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&family=Inter:wght@600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="register">
<div id="chromeHeader"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>ساخت حساب کاربری</h1>
    <p class="sub">به APNA STORE بپیوندید و ۱۰٪ تخفیف اولین سفارش بگیرید</p>
    <form id="authForm" novalidate>
      <div class="field"><label>نام و نام خانوادگی</label><input id="aName" placeholder="نام شما"><span class="err">نام کامل خود را وارد کنید</span></div>
      <div class="field"><label>آدرس ایمیل</label><input id="aEmail" type="email" placeholder="you@example.com"><span class="err">یک ایمیل معتبر وارد کنید</span></div>
      <div class="field"><label>شماره تماس</label><input id="aPhone" placeholder="0912 000 0000"><span class="err">شماره تماس معتبر وارد کنید</span></div>
      <div class="field"><label>رمز عبور</label><input id="aPass" type="password" placeholder="حداقل ۶ نویسه"><span class="err">رمز عبور باید حداقل ۶ نویسه باشد</span></div>
      <div class="field"><label>تکرار رمز عبور</label><input id="aPass2" type="password" placeholder="تکرار رمز عبور"><span class="err">رمزهای عبور یکسان نیستند</span></div>
      <button class="btn btn-primary btn-block" type="submit">ساخت حساب کاربری</button>
    </form>
    <p class="auth-alt">قبلاً حساب کاربری دارید؟ <a href="login.html">ورود</a></p>
  </div>
</div>
<div id="chromeFooter"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
