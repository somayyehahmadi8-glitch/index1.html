<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account — APNA STORE</title>
<meta name="description" content="Create your APNA STORE account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230757C8'/><text x='16' y='23' font-size='17' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="register">
<div id="chromeHeader"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Create account</h1>
    <p class="sub">Join APNA STORE and get 10% off your first order</p>
    <form id="authForm" novalidate>
      <div class="field"><label>Full Name</label><input id="aName" placeholder="Jane Cooper"><span class="err">Enter your full name</span></div>
      <div class="field"><label>Email Address</label><input id="aEmail" type="email" placeholder="you@example.com"><span class="err">Enter a valid email</span></div>
      <div class="field"><label>Phone</label><input id="aPhone" placeholder="+1 555 000 0000"><span class="err">Enter a valid phone number</span></div>
      <div class="field"><label>Password</label><input id="aPass" type="password" placeholder="At least 6 characters"><span class="err">Password must be at least 6 characters</span></div>
      <div class="field"><label>Confirm Password</label><input id="aPass2" type="password" placeholder="Repeat password"><span class="err">Passwords do not match</span></div>
      <button class="btn btn-primary btn-block" type="submit">CREATE ACCOUNT</button>
    </form>
    <p class="auth-alt">Already have an account? <a href="login.html">Log in</a></p>
  </div>
</div>
<div id="chromeFooter"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
