<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — APNA STORE</title>
<meta name="description" content="Log in to your APNA STORE account.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect width='32' height='32' rx='8' fill='%230757C8'/><text x='16' y='23' font-size='17' font-weight='900' text-anchor='middle' fill='white' font-family='Arial'>A</text></svg>">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/styles.css">
</head>
<body data-page="login">
<div id="chromeHeader"></div>
<div class="auth-wrap">
  <div class="auth-card">
    <h1>Welcome back</h1>
    <p class="sub">Log in to your APNA STORE account</p>
    <form id="authForm" novalidate>
      <div class="field"><label>Email Address</label><input id="aEmail" type="email" placeholder="you@example.com"><span class="err">Enter a valid email</span></div>
      <div class="field"><label>Password</label><input id="aPass" type="password" placeholder="••••••••"><span class="err">Password must be at least 6 characters</span></div>
      <button class="btn btn-primary btn-block" type="submit">LOG IN</button>
    </form>
    <p class="auth-alt">New to APNA STORE? <a href="register.html">Create an account</a></p>
    <div class="demo-hint">Demo account: <b>demo@apnastore.com</b> / <b>demo1234</b></div>
  </div>
</div>
<div id="chromeFooter"></div>
<script src="assets/js/data.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/pages.js"></script>
</body>
</html>
